name: IBM i build, test, and package

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
    inputs:
      deploy_samples:
        description: Restore the sample package into the GitHub build library
        type: boolean
        default: false

permissions:
  contents: read
  checks: write

# The test fixture libraries are shared by every GitHub run, regardless of ref.
concurrency:
  group: ibmi-github
  cancel-in-progress: false

jobs:
  ibmi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ibmi-github
    env:
      IBMI_ADDRESS: ${{ secrets.IBMI_ADDRESS }}
      IBMI_USERID: ${{ secrets.IBMI_USERID }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      IBMI_SSH_PORT: ${{ vars.IBMI_SSH_PORT || '22' }}
      OBJECT_LIB: ${{ vars.OBJECT_LIB || 'GHPACK' }}
      BUILD_DIR: ${{ vars.BUILD_DIR }}
      DEPLOY_SAMPLES: ${{ inputs.deploy_samples || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build, test, and package on IBM i
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env IBMI_ADDRESS --env IBMI_USERID --env IBMI_SSH_PORT \
            --env SSH_PRIVATE_KEY --env SSH_KNOWN_HOSTS \
            --env OBJECT_LIB --env BUILD_DIR --env DEPLOY_SAMPLES \
            --env GITHUB_SHA --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            alpine:3.20 sh -ec '
              apk add --no-cache python3 py3-yaml bash
              PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p "test_*.py"
              python3 .github/scripts/ibmi.py
            '

      - name: Restore artifact ownership
        if: always()
        run: |
          for path in rpgunit-results.xml build-logs artifacts artifacts-samples; do
            if [[ -e "$path" ]]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done

      - name: Exercise the Marketplace action
        uses: ./
        with:
          operation: pack
          ibmi-address: ${{ secrets.IBMI_ADDRESS }}
          ibmi-userid: ${{ secrets.IBMI_USERID }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          ibmi-ssh-port: ${{ vars.IBMI_SSH_PORT || '22' }}
          src-lib: ${{ vars.OBJECT_LIB || 'GHPACK' }}
          packager-lib: ${{ vars.OBJECT_LIB || 'GHPACK' }}
          objects: APPCFG APPMSGF
          stmf-name: action-package.savf
          manifest-name: action-pack-manifest.html

      - name: Exercise the pack convenience action
        uses: ./actions/pack
        with:
          ibmi-address: ${{ secrets.IBMI_ADDRESS }}
          ibmi-userid: ${{ secrets.IBMI_USERID }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          ibmi-ssh-port: ${{ vars.IBMI_SSH_PORT || '22' }}
          src-lib: ${{ vars.OBJECT_LIB || 'GHPACK' }}
          packager-lib: ${{ vars.OBJECT_LIB || 'GHPACK' }}
          objects: APPCFG APPMSGF
          stmf-name: convenience-package.savf
          manifest-name: convenience-pack-manifest.html

      - name: Exercise the unpack convenience action
        if: ${{ inputs.deploy_samples }}
        uses: ./actions/unpack
        with:
          ibmi-address: ${{ secrets.IBMI_ADDRESS }}
          ibmi-userid: ${{ secrets.IBMI_USERID }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          ibmi-ssh-port: ${{ vars.IBMI_SSH_PORT || '22' }}
          packager-lib: ${{ vars.OBJECT_LIB || 'GHPACK' }}
          default-lib: ${{ vars.OBJECT_LIB || 'GHPACK' }}
          stmf-artifact: artifacts/convenience-package.savf
          manifest-name: convenience-unpack-manifest.html

      - name: Publish iRPGUnit test results
        if: ${{ always() && hashFiles('rpgunit-results.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: iRPGUnit integration tests
          path: rpgunit-results.xml
          reporter: java-junit
          use-actions-summary: 'true'
          report-title: iRPGUnit integration tests
          collapsed: never
          list-suites: all
          list-tests: all
          fail-on-error: 'true'
          fail-on-empty: 'true'

      - name: Publish iRPGUnit test check
        if: ${{ always() && hashFiles('rpgunit-results.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: iRPGUnit integration tests
          path: rpgunit-results.xml
          reporter: java-junit
          use-actions-summary: 'false'
          list-suites: all
          list-tests: all
          fail-on-error: 'true'
          fail-on-empty: 'true'

      - name: Upload test results, packages, manifests, and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ibmi-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rpgunit-results.xml
            build-logs/
            artifacts/
            artifacts-samples/
          if-no-files-found: warn
          retention-days: 30
